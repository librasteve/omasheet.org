# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Omasheet
email:
description: >- # this means to ignore newlines until "baseurl:"
  What Markdown is to text, Omasheet is to numbers: a plain-text spreadsheet
  format with columns as the computational model and exact (not
  floating-point) arithmetic.
minimal_mistakes_skin: dark
search: false
logo: "/assets/images/logo.svg"
copyright: "Stephen Roe"

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
url: "https://omasheet.org"
baseurl: ""
repository: "librasteve/omasheet.org"
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# A custom exclude: list replaces Jekyll's own defaults rather than
# extending them, so those defaults (vendor/bundle/ etc. -- where the
# Actions build's own installed gems live) are repeated here alongside
# external/, which holds the omasheet repo as a git submodule (see
# .gitmodules) -- pulled in explicitly per-page via include_relative,
# not auto-copied/processed as site content wholesale.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - external/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

author:
  avatar : "/assets/images/logo.svg"
  bio    : "Source code:"
  links:
    - label: "Omasheet"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/librasteve/omasheet"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
